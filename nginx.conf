server {
    listen 80;
    server_name www.smarteat.fr;

    return 301 https://smarteat.fr$request_uri;
}

server {
    listen 80;
    server_name smarteat.fr _;

    root /usr/share/nginx/html;
    index index.html;

    location /_nuxt/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
